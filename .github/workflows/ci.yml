name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Linux runners have a Docker daemon, so the integration lane runs on
          # each architecture. The image is a multi-architecture index, and the direct
          # bind mount of the socket only works on Linux, so amd64 alone would leave
          # the arm64 path of that mount untested.
          - os: ubuntu-latest
            docker: true
          - os: ubuntu-24.04-arm
            docker: true
          - os: windows-latest
            docker: false
          - os: macos-latest
            docker: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # MinVer reads the version from the git history and the tags. A shallow
          # checkout has neither, so the pack step would emit 0.0.0-alpha.0 without
          # a warning and swallow the release tag.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test (no Docker)
        run: >-
          dotnet test --no-build --configuration Release
          --filter-not-trait "Category=IntegrationTests"

      # The tests pull the Parsec image from ghcr.io, which is public, so no login is
      # necessary. Exit code 8 means a test project has no test in this category, which
      # is not a failure. Detailed output puts the parsec-tool output of the tests in
      # the log.
      - name: Test (Docker)
        if: matrix.docker
        run: >-
          dotnet test --no-build --configuration Release
          --filter-trait "Category=IntegrationTests"
          --ignore-exit-code 8 --output Detailed

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack --no-build --configuration Release

      - name: Upload the packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg
          if-no-files-found: error

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Dependabot and forked PRs cannot read repository secrets; skip instead of failing.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # SonarCloud needs full history for blame / new-code detection
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Java (required by the Sonar scanner)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Restore tools & packages
        run: |
          dotnet tool restore
          dotnet restore

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet dotnet-sonarscanner begin \
            /k:"marvin-hsu_Parsec.Dotnet" \
            /o:"marvin-hsu" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/**/*.xml" \
            /d:sonar.coverage.exclusions="tests/**" \
            /d:sonar.exclusions="artifacts/**,external/**,**/StrykerOutput/**,scripts/**,.husky/**" \
            /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Coverage measures the unit tests only. The integration tests need Docker and
      # their coverage would change with the daemon, which makes the number unstable.
      - name: Test with coverage
        run: >-
          dotnet test --no-build --configuration Release --results-directory TestResults
          --coverage --coverage-output-format xml
          --filter-not-trait "Category=IntegrationTests"

      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
