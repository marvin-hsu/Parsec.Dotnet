name: Bug report
description: Report a defect in Parsec.Client
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Security vulnerabilities must NOT be reported here.** Use private vulnerability reporting — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: .NET runtime & OS
      placeholder: e.g. .NET 10 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code sample preferred.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
