# SonarCloud project settings for Parsec.Dotnet (.NET library).
#
# For C# the authoritative analysis path is the Scanner for .NET:
#
#   dotnet tool run dotnet-sonarscanner begin /k:"marvin-hsu_Parsec.Dotnet" /o:"marvin-hsu" \
#       /d:sonar.token="$SONAR_TOKEN" \
#       /d:sonar.cs.vscoveragexml.reportsPaths="artifacts/**/TestResults/**/*.xml"
#   dotnet build --configuration Release
#   dotnet test  --configuration Release --no-build --coverage --coverage-output-format xml
#   dotnet tool run dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
#
# That scanner derives sources from MSBuild and ignores sonar.sources below.
# This file exists so SonarCloud Automatic Analysis (no CI step) and the
# generic sonar-scanner CLI pick up the same key, exclusions and coverage paths.

sonar.host.url=https://sonarcloud.io
sonar.organization=marvin-hsu
sonar.projectKey=marvin-hsu_Parsec.Dotnet
sonar.projectName=Parsec.Dotnet

sonar.sourceEncoding=UTF-8

# ─── Layout ───
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.cs

# Build output, generated code, tooling and non-code assets
sonar.exclusions=\
  artifacts/**,\
  **/bin/**,\
  **/obj/**,\
  **/StrykerOutput/**,\
  **/*.g.cs,\
  **/*.designer.cs,\
  **/GlobalUsings.cs,\
  scripts/**,\
  .husky/**

# ─── Coverage & test reports (.NET) ───
# Sonar for C# accepts VS coverage XML, OpenCover or dotCover, NOT cobertura.
# Produced by Microsoft.Testing.Extensions.CodeCoverage via:
#   dotnet test --coverage --coverage-output-format xml   (MTP opt-in lives in global.json)
sonar.cs.vscoveragexml.reportsPaths=artifacts/**/TestResults/**/*.xml
sonar.coverage.exclusions=tests/**

# Don't count test projects as production code
sonar.dotnet.excludeTestProjects=true

# ─── Quality gate tuning ───
# Stricter than the default: no new duplication tolerated in a small library
sonar.cpd.exclusions=tests/**
